name: Deploy architecture docs to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'Siliqua/docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Repo was private when Pages was first attempted, so it was never
          # enabled at the repo-settings level. enablement: true makes this
          # step turn Pages on via the API instead of requiring a manual
          # Settings -> Pages -> Source: GitHub Actions click.
          enablement: true

      # Publishes only Siliqua/docs/ as the site root, so
      # architecture.ru.html ends up at <pages-url>/architecture.ru.html
      - name: Upload architecture docs as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Siliqua/docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
